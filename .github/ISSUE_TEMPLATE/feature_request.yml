name: 功能建议
description: 新的能力、改进或与路线图相关的想法
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 [ROADMAP.md](https://github.com/Zombiesix/febot/blob/dev/ROADMAP.md)，避免和已有方向重复；如果属于路线图中的一项，请注明。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在的流程是什么、卡在哪、造成了什么代价。不要只写「加个 XX 功能」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 可以粗糙；如果有多个方案，列出取舍。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 流水线 / AgentTeam
        - 工作台 xiaoqian-manager
        - 业务助手 assistant
        - code-indexer
        - 任务来源
        - 桌面端
        - 文档 / DX
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我可以提供真实场景和测试数据