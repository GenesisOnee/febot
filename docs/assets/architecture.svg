<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">febot architecture</title>
  <desc id="desc">Human gates on top, xiaoqian-manager workspace, AgentTeam, and the fact / memory layer below.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .layer { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .box-accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .box-strong { fill: #1e293b; stroke: #1e293b; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 600; fill: #0f172a; }
      .label-invert { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 600; fill: #ffffff; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #64748b; }
      .sub-invert { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #cbd5e1; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #0369a1; }
      .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #475569; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <!-- Human gate -->
  <rect class="box" x="410" y="28" width="380" height="72" rx="10"/>
  <text class="label" x="600" y="57" text-anchor="middle">人 · Human</text>
  <text class="sub" x="600" y="80" text-anchor="middle">梳理需求 · 拍板计划 · 验收 diff · 提交 / 推送 / 合并</text>

  <line class="arrow" x1="600" y1="100" x2="600" y2="140" marker-end="url(#arrow)"/>

  <!-- Workspace layer -->
  <rect class="layer" x="40" y="148" width="1120" height="150" rx="12"/>
  <text class="tag" x="64" y="176">① 工作台 · xiaoqian-manager :3010</text>

  <rect class="box-accent" x="64" y="192" width="240" height="82" rx="8"/>
  <text class="label" x="184" y="226" text-anchor="middle">需求队列</text>
  <text class="sub" x="184" y="250" text-anchor="middle">同步 · 状态机 · tasks.md</text>

  <rect class="box-accent" x="324" y="192" width="240" height="82" rx="8"/>
  <text class="label" x="444" y="226" text-anchor="middle">计划拍板</text>
  <text class="sub" x="444" y="250" text-anchor="middle">AI 出计划 · 人确认</text>

  <rect class="box-accent" x="584" y="192" width="240" height="82" rx="8"/>
  <text class="label" x="704" y="226" text-anchor="middle">审阅与提交</text>
  <text class="sub" x="704" y="250" text-anchor="middle">diff · commit · cherry-pick</text>

  <rect class="box-accent" x="844" y="192" width="292" height="82" rx="8"/>
  <text class="label" x="990" y="226" text-anchor="middle">工时与完成</text>
  <text class="sub" x="990" y="250" text-anchor="middle">回写协作平台 · 只同步远程状态</text>

  <line class="arrow" x1="600" y1="298" x2="600" y2="342" marker-end="url(#arrow)"/>

  <!-- AgentTeam layer -->
  <rect class="layer" x="40" y="350" width="1120" height="178" rx="12"/>
  <text class="tag" x="64" y="378">②③ AgentTeam · /pipeline（文件即接口）</text>

  <rect class="box-strong" x="64" y="394" width="200" height="82" rx="8"/>
  <text class="label-invert" x="164" y="428" text-anchor="middle">orchestrator</text>
  <text class="sub-invert" x="164" y="452" text-anchor="middle">按 state.json 派活</text>

  <rect class="box" x="284" y="394" width="200" height="82" rx="8"/>
  <text class="label" x="384" y="428" text-anchor="middle">planner</text>
  <text class="sub" x="384" y="452" text-anchor="middle">plan.md + 编号问题</text>

  <rect class="box" x="504" y="394" width="200" height="82" rx="8"/>
  <text class="label" x="604" y="428" text-anchor="middle">coder</text>
  <text class="sub" x="604" y="452" text-anchor="middle">只改白名单 · 跑 lint/test</text>

  <rect class="box" x="724" y="394" width="200" height="82" rx="8"/>
  <text class="label" x="824" y="428" text-anchor="middle">reviewer</text>
  <text class="sub" x="824" y="452" text-anchor="middle">只读 diff · blocker ≤2 轮</text>

  <rect class="box" x="944" y="394" width="192" height="82" rx="8"/>
  <text class="label" x="1040" y="428" text-anchor="middle">decisions.md</text>
  <text class="sub" x="1040" y="452" text-anchor="middle">人工拍板审计链</text>

  <text class="note" x="64" y="506">改动留在主仓工作区（不 add / commit / push）· 开工门禁校验基准分支与干净工作区 · 同仓串行，跨仓并行</text>

  <line class="arrow" x1="600" y1="528" x2="600" y2="572" marker-end="url(#arrow)"/>

  <!-- Fact and memory layer -->
  <rect class="layer" x="40" y="580" width="1120" height="150" rx="12"/>
  <text class="tag" x="64" y="608">底座 · 看代码 + 记知识</text>

  <rect class="box" x="64" y="622" width="340" height="82" rx="8"/>
  <text class="label" x="234" y="656" text-anchor="middle">code-indexer</text>
  <text class="sub" x="234" y="680" text-anchor="middle">现算代码事实：路由 / 组件 / store / 权限 / 存储</text>

  <rect class="box" x="424" y="622" width="340" height="82" rx="8"/>
  <text class="label" x="594" y="656" text-anchor="middle">swagger-mcp-server</text>
  <text class="sub" x="594" y="680" text-anchor="middle">实时 API 文档 · 按服务清单供 Agent 查询</text>

  <rect class="box" x="784" y="622" width="352" height="82" rx="8"/>
  <text class="label" x="960" y="656" text-anchor="middle">Hindsight :8888</text>
  <text class="sub" x="960" y="680" text-anchor="middle">按 bank 隔离：研发经验 / 业务知识互不污染</text>
</svg>